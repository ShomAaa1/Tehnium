<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подсказки в углах экрана</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stage" aria-live="polite">
        <div class="hint tl" id="hint-top-left" role="note" aria-label="Верхняя левая подсказка">
            Помни: даже маленький шаг - это прогресс.
        </div>
        <div class="hint tr" id="hint-top-right" role="note" aria-label="Верхняя правая подсказка">
            Совет: Сохраняй часто, если автосохранение не работает.
        </div>
        <div class="hint bl" id="hint-bottom-left" role="note" aria-label="Нижняя левая подсказка">
            Навык дня: практика делает мастерство.
        </div>
        <div class="hint br" id="hint-bottom-right" role="note" aria-label="Нижняя правая подсказка">
            Помни: отдых важен для продуктивности.
        </div>
    </div>
</body>
</html>
